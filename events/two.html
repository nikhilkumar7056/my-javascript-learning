<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <h1>hello coders</h1>
    <button id="stop">stop</button>
</body>
<script>
    // set an time after function will execute

    // const sayName = function(){

    // setTimeout(sayName,4000)
    // setTimeout(function(){

    // stop timeout --------------------------------------------------------------------------------------------
    // we use cleartimeout

    const changeText = function(){
        document.querySelector('h1').innerHTML = `hello nikhillll..........`

    }

    const changingText = setTimeout(changeText,4000)

    // clearTimeout(changingText)
    // adding on an event

    const stopTextChange = document.querySelector('#stop')
    stopTextChange.addEventListener('click', function(){
        clearTimeout(changingText)
        console.log(`set timeout is stop`)
    })


</script>
