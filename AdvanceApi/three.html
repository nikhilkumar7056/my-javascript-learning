<script>
    const requestUrl = 'https://api.datausa.io/tesseract/data.jsonrecords?cube=acs_yg_total_population_5&drilldowns=State,Year&measures=Population&include=Year:2023&limit=100,0'
    const xhr = new XMLHttpRequest()
    xhr.open('GET',requestUrl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState)
        if(xhr.readyState === 4){
            const data = JSON.parse(this.response)
            console.log(data.page.limit)
            for(let i = 0;i<52;i++){
                console.log(data.data[i].State)

            }
        }
    }
    xhr.send()
</script>
